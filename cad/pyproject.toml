# Environment for the printable parts (build123d). The Blender scripts in cad/ use Blender's own Python.
[project]
name = "firefighter-robot-cad"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d==0.13.0",
    "trimesh>=4",
    "networkx>=3",
    "rtree>=1",
    "scipy>=1.18",
    "numpy==2.5.3",
]

[tool.uv]
package = false

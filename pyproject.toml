[project]
name = "firefighter-robot"
version = "0.1.0"
description = "Firefighter robot: ASMR locomotion runtime, aiming software, hardware drivers and simulations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "scipy>=1.18",
    "pillow>=12",
    "onnxruntime>=1.30",
    "pyserial>=3.5",
    "python-can>=4.6.1",
]

[project.optional-dependencies]
board = [
    "gpiod>=2.2",
    "rknn-toolkit-lite2==2.5.0; platform_machine == 'aarch64'",  # NPU runtime for the .rknn fire detector on the ROCK 3C
]
dev = [
    "pytest>=9",
]
sim = [
    "matplotlib>=3.11",
    "mujoco==3.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["aim", "actuators", "robot"]

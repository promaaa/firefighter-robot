# Environment for policy training (MuJoCo Playground, JAX on an NVIDIA GPU). Linux only.
[project]
name = "firefighter-robot-rl"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jax[cuda12]>=0.8.3,<0.9",
    "mujoco==3.15.0",
    "mujoco-mjx==3.15.0",
    "playground==0.2.0",
    "brax>=0.14",
    "numpy==2.5.3",
    "mediapy>=1.2",
    "matplotlib>=3.11",
    "onnx>=1.23",
    "onnxruntime>=1.30",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

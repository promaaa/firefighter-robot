name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Fetch the Berkeley Humanoid Lite assets
        run: scripts/fetch_bhl_assets.sh
      - name: Install the environment
        run: uv sync --locked --extra sim --extra dev
      - name: Build the MuJoCo robot models
        working-directory: sim/payload
        run: uv run --extra sim --extra dev python models.py
      - name: Robot software (aim, actuators, robot)
        run: uv run --extra sim --extra dev pytest -q
      - name: Leg bring-up kit
        run: uv run --extra sim --extra dev pytest legs -q
      - name: ASMR walking network
        run: uv run --extra sim --extra dev python legs/run_policy.py --check
      - name: ASMR standing simulation
        run: uv run --extra sim --extra dev python sim/sim2sim/run.py --check
      - name: Mission simulation
        run: uv run --extra sim --extra dev pytest sim/mission/test_mission.py -q
      - name: Fire detector
        working-directory: vision
        run: uv run --no-project --with numpy --with onnx --with onnxruntime --with opencv-python-headless --with pillow --with pytest pytest test_vision.py -q
      - name: Wiring check
        run: uv run --extra sim --extra dev python docs/hardware/power_calc.py check
